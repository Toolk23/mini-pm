    <title>мини ПМ</title>
    <!-- Защита от белого экрана после деплоя: если браузер взял из кэша старый index.html,
         он ссылается на уже удалённые /assets/*. Ловим ошибку загрузки такого файла
         и один раз перезагружаем страницу в обход кэша (метка в sessionStorage не даёт зациклиться). -->
    <script>
      window.addEventListener('error', function (e) {
        var t = e.target;
        var src = t && (t.src || t.href);
        if (!src || String(src).indexOf('/assets/') === -1) return;
        try {
          if (sessionStorage.getItem('minipm.reloaded')) return;
          sessionStorage.setItem('minipm.reloaded', '1');
        } catch (_) { return; }
        var u = new URL(location.href);
        u.searchParams.set('v', String(Date.now()));
        location.replace(u.toString());
      }, true);
      window.addEventListener('load', function () {
        setTimeout(function () { try { sessionStorage.removeItem('minipm.reloaded'); } catch (_) {} }, 3000);
      });
    </script>
